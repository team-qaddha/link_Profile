    sh.innerHTML='<h3>التحكم</h3><label>الاسم<input id="f-nm" value="'+esc(S.name)+'"></label><label>صورتك<input id="f-ph" type="file" accept="image/*"></label><label>الأغنية<input id="f-so" type="file" accept="audio/*"></label><div class="row"><button id="so-x" type="button" class="sm">إزالة الأغنية</button></div><h4>الخلفية: اختار ثيم أو ضيف ثيم من لونين</h4><div id="chips"></div><div class="row"><input id="c1" type="color" value="#1b1f6b" aria-label="اللون الأول"><input id="c2" type="color" value="#e08a1e" aria-label="اللون الثاني"><button id="add" type="button">أضف ثيم</button></div><h4>ألوان</h4><div class="row"><label>أيقونات التطبيقات <input id="c-ic" type="color" value="'+(S.col.ic||'#ffffff')+'"></label><button id="r-ic" type="button" class="sm">تلقائي</button></div><div class="row"><label>أيقونة الموسيقى <input id="c-pl" type="color" value="'+(S.col.pl||'#ffffff')+'"></label><button id="r-pl" type="button" class="sm">تلقائي</button></div><h4>شفافية وبروز الصورة والمشغّل والعدّاد</h4><label>الشفافية<input id="t-a" type="range" min="0" max="0.6" step="0.01" value="'+S.tile.a+'"></label><label>البروز<input id="t-r" type="range" min="0" max="1" step="0.05" value="'+S.tile.r+'"></label><h4>الأيقونات (علّم الصح على اللي بدك يظهر)</h4>'+lk+'<button id="save" type="button" class="pri">حفظ ونشر</button><p id="msg" role="status"></p>';
    document.body.appendChild(sh);chips();
    $('f-nm').oninput=function(e){S.name=e.target.value;paint()};
    
    sh.querySelectorAll('[data-k]').forEach(function(i){i.oninput=function(){S.links[i.dataset.k]=i.value;paint()}});
    $('chips').onclick=function(e){var d=e.target.dataset;
      if(d.x!==undefined){S.themes.splice(+d.x,1);S.theme=Math.min(S.theme>+d.x?S.theme-1:S.theme,S.themes.length-1)}
      else if(d.i!==undefined)S.theme=+d.i;else return;theme();chips()};
    $('add').onclick=function(){var a=$('c1').value,b=$('c2').value;S.themes.push({c:[a,mix(a,b,.5),b]});S.theme=S.themes.length-1;theme();chips()};
    $('so-x').onclick=function(){S.song='';au.removeAttribute('src');msg('انشالت الأغنية، بيرجع الصوت الهادي. اضغط حفظ ونشر.')};
    $('c-ic').oninput=function(e){S.col.ic=e.target.value;theme()};$('c-pl').oninput=function(e){S.col.pl=e.target.value;theme()};$('r-ic').onclick=function(){delete S.col.ic;$('c-ic').value='#ffffff';theme()};$('r-pl').onclick=function(){delete S.col.pl;$('c-pl').value='#ffffff';theme()};
    sh.querySelectorAll('[data-o]').forEach(function(i){i.onchange=function(){S.on[i.dataset.o]=i.checked;paint()}});
    $('t-a').oninput=function(e){S.tile.a=+e.target.value;theme()};$('t-r').oninput=function(e){S.tile.r=+e.target.value;theme()};
    function local(f,key){return new Promise(function(res){try{
      if(key==='photo'){var im=new Image(),u=URL.createObjectURL(f);im.onload=function(){var s=Math.min(1,640/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);S.photo=c.toDataURL('image/jpeg',.85);URL.revokeObjectURL(u);res(true)};im.onerror=function(){res(false)};im.src=u}
      else if(f.size<7e6){var r=new FileReader();r.onload=function(){S.song=r.result;au.removeAttribute('src');res(true)};r.onerror=function(){res(false)};r.readAsDataURL(f)}
      else res(false)}catch(x){res(false)}})}
    function up(id,key,label){$(id).onchange=async function(e){var f=e.target.files[0];if(!f)return;msg('عم يجهّز '+label+'...');if(await local(f,key)){paint();msg('جاهزة '+label+'. اضغط حفظ ونشر.');return}
      try{var as=await claude.use('assets');if(!as){msg('رفع الملفات مش متاح هون');return}msg('عم يرفع '+label+'...');
        var r=await as.upload(f);S[key]=r.url;if(key==='song')au.removeAttribute('src');paint();msg('انرفعت '+label+'. اضغط حفظ ونشر.')}catch(x){msg('ما انرفعت: '+(x.message||x.code))}}}
    up('f-ph','photo','الصورة');up('f-so','song','الأغنية');
    $('save').onclick=async function(){
      try{var art=await claude.use('artifact');if(!art){msg('النشر مش متاح هون');return}msg('عم يحفظ...');await art.publish(buildDoc())}
      catch(x){msg('ما انحفظ: '+(x.code||x.message))}};
  }
}
(async function(){try{var db=window.claude&&await claude.use('db'),us=window.claude&&await claude.use('user');if(!db)return;var c=db.collection('visits');if(us){try{await c.doc(await us.id()).set({t:Date.now()})}catch(e){}}var s=await c.get();$('vc').textContent=s.size;$('ft').style.display='flex'}catch(e){}})();
(async function(){try{if(!window.claude)return;var u=await claude.use('user');if(u&&await u.isOwner())controls()}catch(e){}})();
})();
</script></body></html>
